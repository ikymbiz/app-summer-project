<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="A4で印刷できる、夏休み研究・観察プリント作成ツールです。" />
  <link rel="manifest" href="manifest.json" />
  <title>夏休み研究・観察プリント作成ツール</title>
  <style>
    :root {
      --bg: #eef4ff;
      --card: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --line: #555555;
      --dark-line: #222222;
      --blue: #0b46c4;
      --thin-line: 0.6pt solid var(--line);
      --light-line: #a8a8a8;
      --accent: #2563eb;
      --paper-w: 210mm;
      --paper-h: 297mm;
      --paper-padding: 12mm;
      --photo-w: 95mm;
      --photo-h: 70mm;
      --preview-scale: 0.52;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 34rem),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .site-header { padding: 20px; }

    .hero {
      max-width: 1180px;
      margin: 0 auto;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(14px);
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 24px;
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.35);
    }

    .hero h1 {
      margin: 0 0 5px;
      font-size: clamp(22px, 3vw, 34px);
      letter-spacing: 0.02em;
    }

    .hero p {
      margin: 0;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-pill {
      border-radius: 999px;
      background: #eef6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 11px;
      white-space: nowrap;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      padding: 0 20px 24px;
      align-items: start;
    }

    .panel {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.10);
      position: sticky;
      top: 14px;
    }

    .panel h2 {
      font-size: 16px;
      margin: 0 0 12px;
    }

    .control { margin-bottom: 14px; }

    label {
      display: block;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      border: 1px solid #cfd8e3;
      border-radius: 12px;
      padding: 10px 11px;
      font: inherit;
      background: #fff;
    }

    button, .file-label {
      border: 0;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 800;
      cursor: pointer;
      background: #e5edff;
      color: #173b86;
      text-align: center;
      font-size: 14px;
      display: block;
      width: 100%;
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
    }

    button.primary {
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      color: #fff;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25);
    }

    button.danger {
      background: #fee2e2;
      color: #991b1b;
    }

    button:hover, .file-label:hover {
      filter: brightness(0.98);
      transform: translateY(-1px);
    }

    input[type="file"] { display: none; }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .button-grid.one { grid-template-columns: 1fr; }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin: 8px 0 0;
    }

    .format-list {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid #dbe4f0;
      border-radius: 14px;
      background: #f8fbff;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin: 0;
    }

    .check-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .drop-zone {
      border: 2px dashed #9db7e8;
      border-radius: 16px;
      padding: 13px;
      background: #f8fbff;
      text-align: center;
      color: #475569;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .drop-zone.dragover {
      background: #eaf2ff;
      border-color: var(--accent);
    }

    .preview-wrap {
      overflow: auto;
      padding: 0 0 24px;
      min-height: calc(100vh - 140px);
    }

    .preview-note {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 10px;
    }

    .sheet-shell {
      width: calc(var(--paper-w) * var(--preview-scale));
      height: calc(var(--paper-h) * var(--preview-scale));
      margin: 0 auto 18px;
      position: relative;
    }

    .paper {
      width: var(--paper-w);
      height: var(--paper-h);
      background: #fff;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
      padding: var(--paper-padding);
      break-after: page;
      position: relative;
      overflow: hidden;
      transform: scale(var(--preview-scale));
      transform-origin: top left;
    }

    .page-heading {
      font-size: 18pt;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin: 0 0 7mm;
      color: #333;
    }

    /* 表紙 */
    .cover-page {
      padding: 16mm 17mm 14mm;
      display: flex;
      flex-direction: column;
      gap: 8mm;
    }

    .cover-title-block {
      margin-top: 10mm;
      text-align: center;
      padding: 0 8mm;
    }

    .cover-thick-line {
      height: 0;
      border-top: 4pt solid var(--dark-line);
    }

    .cover-title-text {
      font-size: 23pt;
      font-weight: 900;
      color: #444;
      letter-spacing: 0.04em;
      line-height: 1.1;
      min-height: 28mm;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 1px 0 #fff;
    }

    .cover-image-frame {
      width: 138mm;
      height: 82mm;
      margin: 6mm auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    .cover-image-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .cover-image-placeholder {
      color: #777;
      font-size: 19pt;
      font-weight: 900;
      text-align: center;
      line-height: 1.35;
      letter-spacing: 0.02em;
    }

    .cover-bottom-info {
      margin-top: auto;
      width: 142mm;
      align-self: center;
      display: grid;
      gap: 6mm;
      color: #444;
      font-weight: 900;
      text-align: left;
      padding-bottom: 2mm;
    }

    .cover-grade-row {
      display: flex;
      gap: 24mm;
      font-size: 18pt;
      line-height: 1.2;
      letter-spacing: 0.04em;
    }

    .cover-info-row {
      font-size: 18pt;
      line-height: 1.2;
      letter-spacing: 0.04em;
    }

    .print-guide-text {
      display: inline-block;
    }

    .empty-text {
      color: #94a3b8;
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
      padding: 8px;
    }

    /* 2枚目 */
    .summary-page {
      display: flex;
      flex-direction: column;
      gap: 5mm;
    }

    .summary-stack {
      display: flex;
      flex-direction: column;
      gap: 5mm;
      flex: 1;
    }

    .summary-section {
      border: var(--thin-line);
      border-radius: 5px;
      padding: 3.5mm;
      display: flex;
      flex-direction: column;
      min-height: 42mm;
    }

    .summary-section.method {
      min-height: 76mm;
    }

    .summary-section.result {
      min-height: 62mm;
    }

    .writing-section {
      border: var(--thin-line);
      border-radius: 5px;
      padding: 4mm;
      display: flex;
      flex-direction: column;
    }

    .writing-section.observation-large { min-height: 58mm; }
    .writing-section.observation-medium { min-height: 50mm; }
    .writing-section.observation-small { min-height: 40mm; }

    .section-label {
      font-size: 14pt;
      font-weight: 800;
      margin-bottom: 3mm;
      color: #333;
    }

    .ruled-lines {
      flex: 1;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 9.5mm,
        var(--light-line) 9.7mm,
        transparent 10mm
      );
    }

    /* 観察カード */
    .observation-page {
      display: flex;
      flex-direction: column;
      gap: 7mm;
    }

    .top-area {
      display: grid;
      grid-template-columns: 1fr var(--photo-w);
      gap: 8mm;
      align-items: start;
    }

    .small-writing-box {
      display: grid;
      gap: 7mm;
      padding-top: 1mm;
    }

    .hand-line {
      display: grid;
      grid-template-columns: 26mm 1fr;
      gap: 4mm;
      align-items: end;
      font-size: 13pt;
      font-weight: 800;
      color: #333;
    }

    .hand-line::after {
      content: "";
      border-bottom: 1.2pt solid var(--line);
      height: 10mm;
    }

    .photo-box {
      width: var(--photo-w);
      height: var(--photo-h);
      border: var(--thin-line);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .page-tools {
      display: flex;
      gap: 6px;
      padding: 8px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      margin-top: auto;
    }

    .page-tools button {
      padding: 7px 9px;
      border-radius: 9px;
      font-size: 12px;
      width: auto;
      flex: 1;
    }

    @media screen and (max-width: 1200px) {
      :root { --preview-scale: 0.46; }
    }

    @media screen and (max-width: 900px) {
      .site-header { padding: 12px; }
      .hero { grid-template-columns: 1fr; }
      .hero-actions { justify-content: flex-start; }
      .app { grid-template-columns: 1fr; padding: 0 12px 18px; }
      .panel { position: static; }
      :root { --preview-scale: 0.40; }
    }

    @page { size: A4 portrait; margin: 0; }

    @media print {
      body { background: #fff; }

      .site-header, .panel, .preview-note, .page-tools {
        display: none !important;
      }

      .app {
        display: block;
        padding: 0;
        max-width: none;
      }

      .preview-wrap {
        overflow: visible;
        padding: 0;
        min-height: 0;
      }

      .sheet-shell {
        width: auto;
        height: auto;
        margin: 0;
      }

      .paper {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0;
        box-shadow: none;
        page-break-after: always;
        break-after: page;
        transform: none !important;
      }

      .sheet-shell:last-child .paper {
        page-break-after: auto;
        break-after: auto;
      }

      .empty-text,
      .print-guide-text,
      .cover-image-placeholder {
        visibility: hidden !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="hero">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🔎</div>
        <div>
          <h1>夏休み研究・観察プリント作成ツール</h1>
          <p>A4印刷用。表紙・研究まとめ・観察カードを選んで印刷できます。</p>
        </div>
      </div>
      <div class="hero-actions">
        <span class="status-pill">A4印刷用</span>
        <button id="installBtn" style="display:none; width:auto; padding-inline:16px;">アプリとして追加</button>
      </div>
    </div>
  </header>

  <main class="app">
    <aside class="panel">
      <h2>フォーマット選択</h2>

      <div class="control format-list">
        <label class="check-row"><input id="showCover" type="checkbox" checked> 表紙</label>
        <label class="check-row"><input id="showSummary" type="checkbox" checked> 研究まとめ</label>
        <label class="check-row"><input id="showObservation" type="checkbox" checked> 観察カード</label>
      </div>

      <div class="control">
        <label class="file-label" for="coverPhotoInput">表紙の写真・イラストを追加</label>
        <input id="coverPhotoInput" type="file" accept="image/*">
        <p class="hint">表紙中央の青枠に表示します。</p>
      </div>

      <div class="drop-zone" id="dropZone">
        観察カード用の写真を<br>ここにドラッグ＆ドロップ
      </div>

      <div class="control">
        <label class="file-label" for="photoInput">観察写真を追加する</label>
        <input id="photoInput" type="file" accept="image/*" multiple>
        <p class="hint">写真1枚につきA4の観察カードを1枚作ります。</p>
      </div>

      <div class="control">
        <label for="photoOrientation">観察写真の向き</label>
        <select id="photoOrientation">
          <option value="landscape">横 約9.5cm × 7cm</option>
          <option value="portrait">縦 約7cm × 9.5cm</option>
        </select>
      </div>

      <div class="button-grid one">
        <button class="primary" id="printBtn">チェックしたページを印刷</button>
      </div>
      <div class="button-grid">
        <button id="addBlankBtn">写真なしカード追加</button>
        <button id="saveBtn">下書き保存</button>
      </div>
      <div class="button-grid">
        <button id="loadBtn">保存を読み込み</button>
        <button class="danger" id="clearBtn">すべて消す</button>
      </div>


    </aside>

    <section class="preview-wrap">
      <p class="preview-note">チェックしたフォーマットだけを表示・印刷します。画面上ではA4全体が見えるよう縮小表示しています。</p>
      <div id="pages"></div>
    </section>
  </main>

  <script>
    const state = {
      coverImage: '',
      observationPages: []
    };

    const els = {
      pages: document.getElementById('pages'),
      showCover: document.getElementById('showCover'),
      showSummary: document.getElementById('showSummary'),
      showObservation: document.getElementById('showObservation'),
      coverPhotoInput: document.getElementById('coverPhotoInput'),
      photoInput: document.getElementById('photoInput'),
      dropZone: document.getElementById('dropZone'),
      photoOrientation: document.getElementById('photoOrientation'),
      printBtn: document.getElementById('printBtn'),
      addBlankBtn: document.getElementById('addBlankBtn'),
      saveBtn: document.getElementById('saveBtn'),
      loadBtn: document.getElementById('loadBtn'),
      clearBtn: document.getElementById('clearBtn'),
      installBtn: document.getElementById('installBtn')
    };

    function makeId() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
    }

    function wrapPaper(paper) {
      const shell = document.createElement('div');
      shell.className = 'sheet-shell';
      shell.appendChild(paper);
      return shell;
    }

    function applyPhotoSize() {
      if (els.photoOrientation.value === 'portrait') {
        document.documentElement.style.setProperty('--photo-w', '70mm');
        document.documentElement.style.setProperty('--photo-h', '95mm');
      } else {
        document.documentElement.style.setProperty('--photo-w', '95mm');
        document.documentElement.style.setProperty('--photo-h', '70mm');
      }
    }

    function render() {
      applyPhotoSize();
      els.pages.innerHTML = '';

      if (els.showCover.checked) {
        els.pages.appendChild(wrapPaper(createCoverPage()));
      }

      if (els.showSummary.checked) {
        els.pages.appendChild(wrapPaper(createSummaryPage()));
      }

      if (els.showObservation.checked) {
        if (state.observationPages.length === 0) addBlankPage(false);
        state.observationPages.forEach(page => {
          els.pages.appendChild(wrapPaper(createObservationPage(page)));
        });
      }

      if (!els.pages.children.length) {
        const message = document.createElement('p');
        message.className = 'preview-note';
        message.textContent = '表示するフォーマットを1つ以上チェックしてください。';
        els.pages.appendChild(message);
      }

      bindPageTools();
    }

    function createCoverPage() {
      const paper = document.createElement('section');
      paper.className = 'paper cover-page';
      const imageContent = state.coverImage
        ? `<img src="${state.coverImage}" alt="表紙の写真・イラスト">`
        : `<div class="cover-image-placeholder">研究に関する<br>写真かイラスト</div>`;

      paper.innerHTML = `
        <div class="cover-title-block">
          <div class="cover-thick-line"></div>
          <div class="cover-title-text"><span class="print-guide-text">研究のタイトル</span></div>
          <div class="cover-thick-line"></div>
        </div>

        <div class="cover-image-frame">${imageContent}</div>

        <div class="cover-bottom-info">
          <div class="cover-grade-row">
            <span>年</span>
            <span>組</span>
          </div>
          <div class="cover-info-row">名前</div>
          <div class="cover-info-row">期間</div>
        </div>

        <div class="page-tools">
          <button class="change-cover-photo">表紙の写真変更</button>
          <button class="remove-cover-photo danger">表紙の写真削除</button>
        </div>
      `;
      return paper;
    }

    function createSummaryPage() {
      const paper = document.createElement('section');
      paper.className = 'paper summary-page';
      paper.innerHTML = `
        <h2 class="page-heading">研究まとめ</h2>
        <div class="summary-stack">
          <section class="summary-section">
            <div class="section-label">研究の動機</div>
            <div class="ruled-lines"></div>
          </section>
          <section class="summary-section">
            <div class="section-label">研究の目的</div>
            <div class="ruled-lines"></div>
          </section>
          <section class="summary-section method">
            <div class="section-label">研究の方法</div>
            <div class="ruled-lines"></div>
          </section>
          <section class="summary-section result">
            <div class="section-label">研究の結果</div>
            <div class="ruled-lines"></div>
          </section>
        </div>
      `;
      return paper;
    }

    function createObservationPage(page) {
      const paper = document.createElement('section');
      paper.className = 'paper observation-page';
      paper.dataset.id = page.id;

      const photoContent = page.imageData
        ? `<img src="${page.imageData}" alt="観察写真">`
        : `<div class="empty-text">写真を追加すると<br>ここに表示されます</div>`;

      paper.innerHTML = `
        <h2 class="page-heading">観察カード</h2>
        <div class="top-area">
          <div class="small-writing-box">
            <div class="hand-line">日付</div>
            <div class="hand-line">場所</div>
            <div class="hand-line">天気</div>
          </div>
          <div class="photo-box">${photoContent}</div>
        </div>

        <section class="writing-section observation-large">
          <div class="section-label">観察したこと</div>
          <div class="ruled-lines"></div>
        </section>

        <section class="writing-section observation-medium">
          <div class="section-label">気づいたこと・ふしぎに思ったこと</div>
          <div class="ruled-lines"></div>
        </section>

        <section class="writing-section observation-small">
          <div class="section-label">自分の考え・予想</div>
          <div class="ruled-lines"></div>
        </section>

        <div class="page-tools">
          <button class="change-photo">写真変更</button>
          <button class="duplicate-page">コピー</button>
          <button class="delete-page danger">削除</button>
        </div>
      `;
      return paper;
    }

    function bindPageTools() {
      const coverChange = document.querySelector('.change-cover-photo');
      if (coverChange) coverChange.addEventListener('click', () => els.coverPhotoInput.click());

      const coverRemove = document.querySelector('.remove-cover-photo');
      if (coverRemove) coverRemove.addEventListener('click', () => {
        state.coverImage = '';
        render();
      });

      document.querySelectorAll('.observation-page').forEach(pageEl => {
        const id = pageEl.dataset.id;

        pageEl.querySelector('.change-photo').addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.addEventListener('change', async () => {
            const file = input.files && input.files[0];
            if (!file) return;
            const imageData = await fileToDataURL(file);
            const page = state.observationPages.find(p => p.id === id);
            if (page) page.imageData = imageData;
            render();
          });
          input.click();
        });

        pageEl.querySelector('.duplicate-page').addEventListener('click', () => {
          const page = state.observationPages.find(p => p.id === id);
          if (!page) return;
          const index = state.observationPages.findIndex(p => p.id === id);
          state.observationPages.splice(index + 1, 0, { ...page, id: makeId() });
          render();
        });

        pageEl.querySelector('.delete-page').addEventListener('click', () => {
          state.observationPages = state.observationPages.filter(p => p.id !== id);
          render();
        });
      });
    }

    function addBlankPage(shouldRender = true) {
      state.observationPages.push({ id: makeId(), imageData: '' });
      if (shouldRender) render();
    }

    async function addObservationFiles(files) {
      const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
      for (const file of imageFiles) {
        const imageData = await fileToDataURL(file);
        state.observationPages.push({ id: makeId(), imageData });
      }
      render();
    }

    async function setCoverFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      state.coverImage = await fileToDataURL(file);
      render();
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function printSelected() {
      if (!els.showCover.checked && !els.showSummary.checked && !els.showObservation.checked) {
        alert('印刷するフォーマットを1つ以上チェックしてください。');
        return;
      }
      window.print();
    }

    function saveDraft() {
      const data = {
        showCover: els.showCover.checked,
        showSummary: els.showSummary.checked,
        showObservation: els.showObservation.checked,
        photoOrientation: els.photoOrientation.value,
        coverImage: state.coverImage,
        observationPages: state.observationPages
      };
      localStorage.setItem('summerResearchObservationToolV8', JSON.stringify(data));
      alert('下書きを保存しました。');
    }

    function loadDraft() {
      const raw = localStorage.getItem('summerResearchObservationToolV8');
      if (!raw) {
        alert('保存された下書きがありません。');
        return;
      }
      const data = JSON.parse(raw);
      els.showCover.checked = data.showCover ?? true;
      els.showSummary.checked = data.showSummary ?? true;
      els.showObservation.checked = data.showObservation ?? true;
      els.photoOrientation.value = data.photoOrientation || 'landscape';
      state.coverImage = data.coverImage || '';
      state.observationPages = Array.isArray(data.observationPages) ? data.observationPages : [];
      render();
    }

    function clearAll() {
      if (!confirm('すべての写真とページを消しますか？')) return;
      state.coverImage = '';
      state.observationPages = [];
      render();
    }

    [els.showCover, els.showSummary, els.showObservation, els.photoOrientation].forEach(el => {
      el.addEventListener('change', render);
    });

    els.coverPhotoInput.addEventListener('change', event => {
      const file = event.target.files && event.target.files[0];
      setCoverFile(file);
      event.target.value = '';
    });

    els.photoInput.addEventListener('change', event => {
      addObservationFiles(event.target.files);
      event.target.value = '';
    });

    els.dropZone.addEventListener('dragover', event => {
      event.preventDefault();
      els.dropZone.classList.add('dragover');
    });

    els.dropZone.addEventListener('dragleave', () => els.dropZone.classList.remove('dragover'));

    els.dropZone.addEventListener('drop', event => {
      event.preventDefault();
      els.dropZone.classList.remove('dragover');
      addObservationFiles(event.dataTransfer.files);
    });

    els.printBtn.addEventListener('click', printSelected);
    els.addBlankBtn.addEventListener('click', () => addBlankPage(true));
    els.saveBtn.addEventListener('click', saveDraft);
    els.loadBtn.addEventListener('click', loadDraft);
    els.clearBtn.addEventListener('click', clearAll);

    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      els.installBtn.style.display = 'block';
    });

    els.installBtn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      els.installBtn.style.display = 'none';
    });

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {
          console.log('Service worker registration failed.');
        });
      });
    }

    addBlankPage(false);
    render();
  </script>
</body>
</html>
