<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>夏休み観察プリント作成ツール A4手書き版</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --line: #111827;
      --light-line: #cbd5e1;
      --accent: #2563eb;
      --paper-w: 210mm;
      --paper-h: 297mm;
      --paper-padding: 12mm;
      --photo-w: 95mm;
      --photo-h: 70mm;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 18px 20px;
      background: linear-gradient(135deg, #eff6ff, #ffffff);
      border-bottom: 1px solid #dbe4f0;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
    }

    .app {
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 18px;
      padding: 18px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid #dbe4f0;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      position: sticky;
      top: 12px;
    }

    .panel h2 {
      font-size: 16px;
      margin: 0 0 12px;
    }

    .control { margin-bottom: 14px; }

    label {
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 6px;
    }

    input[type="text"], select, textarea {
      width: 100%;
      border: 1px solid #cfd8e3;
      border-radius: 10px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
      line-height: 1.6;
    }

    button, .file-label {
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
      background: #e5edff;
      color: #173b86;
      text-align: center;
      font-size: 14px;
      display: block;
      width: 100%;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
    }

    button.danger {
      background: #fee2e2;
      color: #991b1b;
    }

    button:hover, .file-label:hover { filter: brightness(0.97); }

    input[type="file"] { display: none; }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .button-grid.one { grid-template-columns: 1fr; }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin: 8px 0 0;
    }

    .drop-zone {
      border: 2px dashed #9db7e8;
      border-radius: 14px;
      padding: 14px;
      background: #f8fbff;
      text-align: center;
      color: #475569;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .drop-zone.dragover {
      background: #eaf2ff;
      border-color: var(--accent);
    }

    .preview-wrap {
      overflow: auto;
      padding: 6px 0 30px;
    }

    .paper {
      width: var(--paper-w);
      height: var(--paper-h);
      margin: 0 auto 18px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
      padding: var(--paper-padding);
      break-after: page;
      position: relative;
    }

    .page-title {
      text-align: center;
      font-size: 20pt;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin: 0 0 8mm;
    }

    .cover-frame {
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 8mm;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10mm;
    }

    .cover-title-box {
      border: 2px solid var(--line);
      height: 42mm;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14pt;
      font-weight: 700;
    }

    .cover-big-box {
      border: 2px solid var(--line);
      flex: 1;
      min-height: 120mm;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13pt;
      font-weight: 700;
    }

    .cover-lines {
      display: grid;
      gap: 9mm;
      font-size: 13pt;
      font-weight: 700;
    }

    .line-row {
      display: grid;
      grid-template-columns: 42mm 1fr;
      gap: 5mm;
      align-items: end;
    }

    .line-row::after {
      content: "";
      border-bottom: 2px solid var(--line);
      height: 8mm;
      display: block;
    }

    .observation-page {
      display: flex;
      flex-direction: column;
      gap: 7mm;
    }

    .top-area {
      display: grid;
      grid-template-columns: var(--photo-w) 1fr;
      gap: 8mm;
      align-items: start;
    }

    .photo-box {
      width: var(--photo-w);
      height: var(--photo-h);
      border: 2px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .empty-photo {
      color: #94a3b8;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
      padding: 8px;
    }

    .small-writing-box {
      display: grid;
      gap: 6mm;
      padding-top: 1mm;
    }

    .hand-line {
      display: grid;
      grid-template-columns: 32mm 1fr;
      gap: 4mm;
      align-items: end;
      font-size: 13pt;
      font-weight: 800;
    }

    .hand-line::after {
      content: "";
      border-bottom: 2px solid var(--line);
      height: 9mm;
    }

    .writing-section {
      border: 2px solid var(--line);
      border-radius: 7px;
      padding: 4mm;
      min-height: 42mm;
      display: flex;
      flex-direction: column;
    }

    .writing-section.large { min-height: 58mm; }
    .writing-section.medium { min-height: 50mm; }

    .section-label {
      font-size: 14pt;
      font-weight: 800;
      margin-bottom: 3mm;
    }

    .ruled-lines {
      flex: 1;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 9.5mm,
        var(--light-line) 9.7mm,
        transparent 10mm
      );
    }

    .card-tools {
      display: flex;
      gap: 6px;
      padding: 8px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      margin-top: 6mm;
    }

    .card-tools button {
      padding: 7px 9px;
      border-radius: 9px;
      font-size: 12px;
      width: auto;
      flex: 1;
    }

    .no-print-note {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: 8px 0 0;
    }

    .cover-page.hidden-in-preview {
      display: none;
    }

    @media screen and (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .panel { position: static; }
    }

    @page { size: A4 portrait; margin: 0; }

    @media print {
      body { background: #fff; }

      header, .panel, .no-print-note, .card-tools {
        display: none !important;
      }

      .app {
        display: block;
        padding: 0;
      }

      .preview-wrap {
        overflow: visible;
        padding: 0;
      }

      .paper {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0;
        box-shadow: none;
        page-break-after: always;
        break-after: page;
      }

      .paper:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      .empty-photo {
        visibility: hidden !important;
      }

      body.print-cover-only .observation-page {
        display: none !important;
      }

      body.print-observations-only .cover-page {
        display: none !important;
      }

      .cover-page.hidden-in-preview {
        display: block !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>夏休み観察プリント作成ツール A4手書き版</h1>
    <p>A4専用。写真は約7cm×9.5cmで配置し、観察内容は手書きしやすい大きめの罫線欄にしています。</p>
  </header>

  <main class="app">
    <aside class="panel">
      <h2>設定</h2>

      <div class="drop-zone" id="dropZone">
        写真をここにドラッグ＆ドロップ<br>または下のボタンから追加
      </div>

      <div class="control">
        <label class="file-label" for="photoInput">写真を追加する</label>
        <input id="photoInput" type="file" accept="image/*" multiple>
        <p class="hint">写真1枚につき、A4の観察ページを1枚作ります。写真は外部送信されません。</p>
      </div>

      <div class="control">
        <label for="photoOrientation">写真の向き</label>
        <select id="photoOrientation">
          <option value="landscape">横 約9.5cm × 7cm</option>
          <option value="portrait">縦 約7cm × 9.5cm</option>
        </select>
      </div>

      <div class="control">
        <label for="coverPreview">画面での表紙表示</label>
        <select id="coverPreview">
          <option value="show">表示する</option>
          <option value="hide">表示しない</option>
        </select>
      </div>

      <div class="button-grid one">
        <button class="primary" id="printAllBtn">表紙と観察ページを印刷</button>
      </div>
      <div class="button-grid">
        <button id="printCoverBtn">表紙だけ印刷</button>
        <button id="printPagesBtn">観察ページだけ印刷</button>
      </div>
      <div class="button-grid">
        <button id="addBlankBtn">写真なしページ追加</button>
        <button id="saveBtn">下書き保存</button>
      </div>
      <div class="button-grid">
        <button id="loadBtn">保存を読み込み</button>
        <button class="danger" id="clearBtn">すべて消す</button>
      </div>

      <p class="hint">
        印刷時はブラウザの印刷設定を「A4・縦・倍率100%・余白なしまたは既定」にしてください。グレーの案内文は印刷時に消えます。
      </p>
    </aside>

    <section class="preview-wrap">
      <div id="pages"></div>
      <p class="no-print-note">ここが印刷プレビューです。表紙と観察ページは別々にも印刷できます。</p>
    </section>
  </main>

  <script>
    const state = {
      pages: []
    };

    const els = {
      pages: document.getElementById('pages'),
      photoInput: document.getElementById('photoInput'),
      dropZone: document.getElementById('dropZone'),
      photoOrientation: document.getElementById('photoOrientation'),
      coverPreview: document.getElementById('coverPreview'),
      printAllBtn: document.getElementById('printAllBtn'),
      printCoverBtn: document.getElementById('printCoverBtn'),
      printPagesBtn: document.getElementById('printPagesBtn'),
      addBlankBtn: document.getElementById('addBlankBtn'),
      saveBtn: document.getElementById('saveBtn'),
      loadBtn: document.getElementById('loadBtn'),
      clearBtn: document.getElementById('clearBtn')
    };

    function makeId() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
    }

    function applyPhotoSize() {
      const orientation = els.photoOrientation.value;
      if (orientation === 'portrait') {
        document.documentElement.style.setProperty('--photo-w', '70mm');
        document.documentElement.style.setProperty('--photo-h', '95mm');
      } else {
        document.documentElement.style.setProperty('--photo-w', '95mm');
        document.documentElement.style.setProperty('--photo-h', '70mm');
      }
    }

    function render() {
      applyPhotoSize();
      els.pages.innerHTML = '';

      const cover = createCoverPage();
      if (els.coverPreview.value === 'hide') {
        cover.classList.add('hidden-in-preview');
      }
      els.pages.appendChild(cover);

      if (state.pages.length === 0) {
        addBlankPage(false);
      }

      state.pages.forEach((page, index) => {
        els.pages.appendChild(createObservationPage(page, index));
      });

      bindPageTools();
    }

    function createCoverPage() {
      const paper = document.createElement('section');
      paper.className = 'paper cover-page';
      paper.innerHTML = `
        <div class="cover-frame">
          <h2 class="page-title">表紙</h2>
          <div class="cover-title-box">題名</div>
          <div class="cover-big-box">絵・写真・大きな見出し</div>
          <div class="cover-lines">
            <div class="line-row">調べるもの</div>
            <div class="line-row">調べる理由</div>
          </div>
        </div>
      `;
      return paper;
    }

    function createObservationPage(page, index) {
      const paper = document.createElement('section');
      paper.className = 'paper observation-page';
      paper.dataset.id = page.id;

      const photoContent = page.imageData
        ? `<img src="${page.imageData}" alt="観察写真${index + 1}">`
        : `<div class="empty-photo">写真を追加すると<br>ここに表示されます</div>`;

      paper.innerHTML = `
        <h2 class="page-title">観察カード ${index + 1}</h2>
        <div class="top-area">
          <div class="photo-box">${photoContent}</div>
          <div class="small-writing-box">
            <div class="hand-line">日づけ</div>
            <div class="hand-line">場所</div>
            <div class="hand-line">天気</div>
          </div>
        </div>

        <section class="writing-section large">
          <div class="section-label">観察したこと</div>
          <div class="ruled-lines"></div>
        </section>

        <section class="writing-section medium">
          <div class="section-label">気づいたこと・ふしぎに思ったこと</div>
          <div class="ruled-lines"></div>
        </section>

        <section class="writing-section">
          <div class="section-label">自分の考え・予想</div>
          <div class="ruled-lines"></div>
        </section>

        <div class="card-tools">
          <button class="change-photo">写真変更</button>
          <button class="duplicate-page">コピー</button>
          <button class="delete-page danger">削除</button>
        </div>
      `;

      return paper;
    }

    function bindPageTools() {
      document.querySelectorAll('.observation-page').forEach(pageEl => {
        const id = pageEl.dataset.id;

        pageEl.querySelector('.change-photo').addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.addEventListener('change', async () => {
            const file = input.files && input.files[0];
            if (!file) return;
            const imageData = await fileToDataURL(file);
            const page = state.pages.find(p => p.id === id);
            if (page) page.imageData = imageData;
            render();
          });
          input.click();
        });

        pageEl.querySelector('.duplicate-page').addEventListener('click', () => {
          const page = state.pages.find(p => p.id === id);
          if (!page) return;
          const index = state.pages.findIndex(p => p.id === id);
          state.pages.splice(index + 1, 0, { ...page, id: makeId() });
          render();
        });

        pageEl.querySelector('.delete-page').addEventListener('click', () => {
          state.pages = state.pages.filter(p => p.id !== id);
          render();
        });
      });
    }

    function addBlankPage(shouldRender = true) {
      state.pages.push({ id: makeId(), imageData: '' });
      if (shouldRender) render();
    }

    async function addFiles(files) {
      const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
      for (const file of imageFiles) {
        const imageData = await fileToDataURL(file);
        state.pages.push({ id: makeId(), imageData });
      }
      render();
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function printMode(mode) {
      document.body.classList.remove('print-cover-only', 'print-observations-only');
      if (mode === 'cover') document.body.classList.add('print-cover-only');
      if (mode === 'observations') document.body.classList.add('print-observations-only');
      window.print();
      setTimeout(() => {
        document.body.classList.remove('print-cover-only', 'print-observations-only');
      }, 500);
    }

    function saveDraft() {
      const data = {
        photoOrientation: els.photoOrientation.value,
        coverPreview: els.coverPreview.value,
        pages: state.pages
      };
      localStorage.setItem('summerObservationA4HandwritingTool', JSON.stringify(data));
      alert('下書きを保存しました。');
    }

    function loadDraft() {
      const raw = localStorage.getItem('summerObservationA4HandwritingTool');
      if (!raw) {
        alert('保存された下書きがありません。');
        return;
      }
      const data = JSON.parse(raw);
      els.photoOrientation.value = data.photoOrientation || 'landscape';
      els.coverPreview.value = data.coverPreview || 'show';
      state.pages = Array.isArray(data.pages) ? data.pages : [];
      render();
    }

    function clearAll() {
      if (!confirm('すべての写真とページを消しますか？')) return;
      state.pages = [];
      render();
    }

    els.photoInput.addEventListener('change', event => {
      addFiles(event.target.files);
      event.target.value = '';
    });

    els.dropZone.addEventListener('dragover', event => {
      event.preventDefault();
      els.dropZone.classList.add('dragover');
    });

    els.dropZone.addEventListener('dragleave', () => els.dropZone.classList.remove('dragover'));

    els.dropZone.addEventListener('drop', event => {
      event.preventDefault();
      els.dropZone.classList.remove('dragover');
      addFiles(event.dataTransfer.files);
    });

    els.photoOrientation.addEventListener('change', render);
    els.coverPreview.addEventListener('change', render);
    els.printAllBtn.addEventListener('click', () => printMode('all'));
    els.printCoverBtn.addEventListener('click', () => printMode('cover'));
    els.printPagesBtn.addEventListener('click', () => printMode('observations'));
    els.addBlankBtn.addEventListener('click', () => addBlankPage(true));
    els.saveBtn.addEventListener('click', saveDraft);
    els.loadBtn.addEventListener('click', loadDraft);
    els.clearBtn.addEventListener('click', clearAll);

    addBlankPage(false);
    render();
  </script>
</body>
</html>
