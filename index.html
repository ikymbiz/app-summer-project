<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>夏休み観察プリント作成ツール A4手書き版</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --line: #555555;
      --light-line: #a8a8a8;
      --accent: #2563eb;
      --paper-w: 210mm;
      --paper-h: 297mm;
      --paper-padding: 12mm;
      --photo-w: 95mm;
      --photo-h: 70mm;
      --preview-zoom: 0.55;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #eff6ff, #ffffff);
      border-bottom: 1px solid #dbe4f0;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    header p {
      margin: 0;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
    }

    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      padding: 16px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid #dbe4f0;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      position: sticky;
      top: 12px;
    }

    .panel h2 {
      font-size: 16px;
      margin: 0 0 12px;
    }

    .control { margin-bottom: 14px; }

    label {
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      border: 1px solid #cfd8e3;
      border-radius: 10px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
    }

    button, .file-label {
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
      background: #e5edff;
      color: #173b86;
      text-align: center;
      font-size: 14px;
      display: block;
      width: 100%;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
    }

    button.danger {
      background: #fee2e2;
      color: #991b1b;
    }

    button:hover, .file-label:hover { filter: brightness(0.97); }

    input[type="file"] { display: none; }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .button-grid.one { grid-template-columns: 1fr; }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin: 8px 0 0;
    }

    .format-list {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid #dbe4f0;
      border-radius: 12px;
      background: #f8fbff;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin: 0;
    }

    .check-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .drop-zone {
      border: 2px dashed #9db7e8;
      border-radius: 14px;
      padding: 13px;
      background: #f8fbff;
      text-align: center;
      color: #475569;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .drop-zone.dragover {
      background: #eaf2ff;
      border-color: var(--accent);
    }

    .preview-wrap {
      overflow: auto;
      padding: 0 0 24px;
      min-height: calc(100vh - 110px);
    }

    .preview-note {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 10px;
    }

    .paper {
      width: var(--paper-w);
      height: var(--paper-h);
      margin: 0 auto 18px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
      padding: var(--paper-padding);
      break-after: page;
      position: relative;
      overflow: hidden;
    }

    @media screen {
      .paper {
        zoom: var(--preview-zoom);
      }
    }

    .page-heading {
      font-size: 18pt;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin: 0 0 7mm;
      color: #333;
    }

    .cover-page {
      display: flex;
      flex-direction: column;
      gap: 10mm;
    }

    .cover-title-row {
      display: grid;
      grid-template-columns: 24mm 1fr;
      gap: 5mm;
      align-items: end;
      font-size: 15pt;
      font-weight: 800;
      margin-top: 2mm;
    }

    .cover-title-row::after {
      content: "";
      display: block;
      height: 14mm;
      border-bottom: 1px solid var(--line);
    }

    .cover-image-box {
      border: 1px solid var(--line);
      border-radius: 6px;
      flex: 1;
      min-height: 190mm;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
      position: relative;
    }

    .cover-image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .empty-text {
      color: #94a3b8;
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
      padding: 8px;
    }

    .research-page {
      display: flex;
      flex-direction: column;
      gap: 8mm;
    }

    .writing-section {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4mm;
      display: flex;
      flex-direction: column;
    }

    .writing-section.research-large { min-height: 100mm; }
    .writing-section.observation-large { min-height: 58mm; }
    .writing-section.observation-medium { min-height: 50mm; }
    .writing-section.observation-small { min-height: 40mm; }

    .section-label {
      font-size: 14pt;
      font-weight: 800;
      margin-bottom: 3mm;
      color: #333;
    }

    .ruled-lines {
      flex: 1;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 9.5mm,
        var(--light-line) 9.7mm,
        transparent 10mm
      );
    }

    .observation-page {
      display: flex;
      flex-direction: column;
      gap: 7mm;
    }

    .top-area {
      display: grid;
      grid-template-columns: 1fr var(--photo-w);
      gap: 8mm;
      align-items: start;
    }

    .small-writing-box {
      display: grid;
      gap: 7mm;
      padding-top: 1mm;
    }

    .hand-line {
      display: grid;
      grid-template-columns: 26mm 1fr;
      gap: 4mm;
      align-items: end;
      font-size: 13pt;
      font-weight: 800;
      color: #333;
    }

    .hand-line::after {
      content: "";
      border-bottom: 1px solid var(--line);
      height: 10mm;
    }

    .photo-box {
      width: var(--photo-w);
      height: var(--photo-h);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .page-tools {
      display: flex;
      gap: 6px;
      padding: 8px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      margin-top: auto;
    }

    .page-tools button {
      padding: 7px 9px;
      border-radius: 9px;
      font-size: 12px;
      width: auto;
      flex: 1;
    }

    .is-hidden { display: none !important; }

    @media screen and (max-width: 1200px) {
      :root { --preview-zoom: 0.48; }
    }

    @media screen and (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .panel { position: static; }
      :root { --preview-zoom: 0.42; }
    }

    @page { size: A4 portrait; margin: 0; }

    @media print {
      body { background: #fff; }

      header, .panel, .preview-note, .page-tools {
        display: none !important;
      }

      .app {
        display: block;
        padding: 0;
      }

      .preview-wrap {
        overflow: visible;
        padding: 0;
        min-height: 0;
      }

      .paper {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0;
        box-shadow: none;
        page-break-after: always;
        break-after: page;
        zoom: 1 !important;
      }

      .paper:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      .empty-text {
        visibility: hidden !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>夏休み観察プリント作成ツール A4手書き版</h1>
    <p>写真を入れて印刷し、文字は手書きできる観察用フォーマットです。画面表示ではA4全体が見えるよう縮小表示します。</p>
  </header>

  <main class="app">
    <aside class="panel">
      <h2>フォーマット選択</h2>

      <div class="control format-list">
        <label class="check-row"><input id="showCover" type="checkbox" checked> 表紙</label>
        <label class="check-row"><input id="showResearch" type="checkbox" checked> 調べるもの・調べる理由</label>
        <label class="check-row"><input id="showObservation" type="checkbox" checked> 観察カード</label>
      </div>

      <div class="control">
        <label class="file-label" for="coverPhotoInput">表紙の写真・絵を追加</label>
        <input id="coverPhotoInput" type="file" accept="image/*">
        <p class="hint">表紙の大きな枠に表示されます。文字や見出しは手書きできます。</p>
      </div>

      <div class="drop-zone" id="dropZone">
        観察カード用の写真を<br>ここにドラッグ＆ドロップ
      </div>

      <div class="control">
        <label class="file-label" for="photoInput">観察写真を追加する</label>
        <input id="photoInput" type="file" accept="image/*" multiple>
        <p class="hint">写真1枚につきA4の観察カードを1枚作ります。</p>
      </div>

      <div class="control">
        <label for="photoOrientation">観察写真の向き</label>
        <select id="photoOrientation">
          <option value="landscape">横 約9.5cm × 7cm</option>
          <option value="portrait">縦 約7cm × 9.5cm</option>
        </select>
      </div>

      <div class="button-grid one">
        <button class="primary" id="printBtn">チェックしたページを印刷</button>
      </div>
      <div class="button-grid">
        <button id="addBlankBtn">写真なしカード追加</button>
        <button id="saveBtn">下書き保存</button>
      </div>
      <div class="button-grid">
        <button id="loadBtn">保存を読み込み</button>
        <button class="danger" id="clearBtn">すべて消す</button>
      </div>

      <p class="hint">
        印刷時は「A4・縦・倍率100%」がおすすめです。グレーの案内文や画面用ボタンは印刷されません。
      </p>
    </aside>

    <section class="preview-wrap">
      <p class="preview-note">チェックしたフォーマットだけを表示・印刷します。</p>
      <div id="pages"></div>
    </section>
  </main>

  <script>
    const state = {
      coverImage: '',
      observationPages: []
    };

    const els = {
      pages: document.getElementById('pages'),
      showCover: document.getElementById('showCover'),
      showResearch: document.getElementById('showResearch'),
      showObservation: document.getElementById('showObservation'),
      coverPhotoInput: document.getElementById('coverPhotoInput'),
      photoInput: document.getElementById('photoInput'),
      dropZone: document.getElementById('dropZone'),
      photoOrientation: document.getElementById('photoOrientation'),
      printBtn: document.getElementById('printBtn'),
      addBlankBtn: document.getElementById('addBlankBtn'),
      saveBtn: document.getElementById('saveBtn'),
      loadBtn: document.getElementById('loadBtn'),
      clearBtn: document.getElementById('clearBtn')
    };

    function makeId() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
    }

    function applyPhotoSize() {
      if (els.photoOrientation.value === 'portrait') {
        document.documentElement.style.setProperty('--photo-w', '70mm');
        document.documentElement.style.setProperty('--photo-h', '95mm');
      } else {
        document.documentElement.style.setProperty('--photo-w', '95mm');
        document.documentElement.style.setProperty('--photo-h', '70mm');
      }
    }

    function render() {
      applyPhotoSize();
      els.pages.innerHTML = '';

      if (els.showCover.checked) {
        els.pages.appendChild(createCoverPage());
      }

      if (els.showResearch.checked) {
        els.pages.appendChild(createResearchPage());
      }

      if (els.showObservation.checked) {
        if (state.observationPages.length === 0) addBlankPage(false);
        state.observationPages.forEach(page => {
          els.pages.appendChild(createObservationPage(page));
        });
      }

      if (!els.pages.children.length) {
        const message = document.createElement('p');
        message.className = 'preview-note';
        message.textContent = '表示するフォーマットを1つ以上チェックしてください。';
        els.pages.appendChild(message);
      }

      bindPageTools();
    }

    function createCoverPage() {
      const paper = document.createElement('section');
      paper.className = 'paper cover-page';
      const imageContent = state.coverImage
        ? `<img src="${state.coverImage}" alt="表紙の写真・絵">`
        : `<div class="empty-text">写真・絵・大きな見出しを入れるところ</div>`;

      paper.innerHTML = `
        <div class="cover-title-row">題名</div>
        <div class="cover-image-box">${imageContent}</div>
        <div class="page-tools">
          <button class="change-cover-photo">表紙の写真変更</button>
          <button class="remove-cover-photo danger">表紙の写真削除</button>
        </div>
      `;
      return paper;
    }

    function createResearchPage() {
      const paper = document.createElement('section');
      paper.className = 'paper research-page';
      paper.innerHTML = `
        <h2 class="page-heading">調べるもの・調べる理由</h2>
        <section class="writing-section research-large">
          <div class="section-label">調べるもの</div>
          <div class="ruled-lines"></div>
        </section>
        <section class="writing-section research-large">
          <div class="section-label">調べる理由</div>
          <div class="ruled-lines"></div>
        </section>
      `;
      return paper;
    }

    function createObservationPage(page) {
      const paper = document.createElement('section');
      paper.className = 'paper observation-page';
      paper.dataset.id = page.id;

      const photoContent = page.imageData
        ? `<img src="${page.imageData}" alt="観察写真">`
        : `<div class="empty-text">写真を追加すると<br>ここに表示されます</div>`;

      paper.innerHTML = `
        <h2 class="page-heading">観察カード</h2>
        <div class="top-area">
          <div class="small-writing-box">
            <div class="hand-line">日付</div>
            <div class="hand-line">場所</div>
            <div class="hand-line">天気</div>
          </div>
          <div class="photo-box">${photoContent}</div>
        </div>

        <section class="writing-section observation-large">
          <div class="section-label">観察したこと</div>
          <div class="ruled-lines"></div>
        </section>

        <section class="writing-section observation-medium">
          <div class="section-label">気づいたこと・ふしぎに思ったこと</div>
          <div class="ruled-lines"></div>
        </section>

        <section class="writing-section observation-small">
          <div class="section-label">自分の考え・予想</div>
          <div class="ruled-lines"></div>
        </section>

        <div class="page-tools">
          <button class="change-photo">写真変更</button>
          <button class="duplicate-page">コピー</button>
          <button class="delete-page danger">削除</button>
        </div>
      `;
      return paper;
    }

    function bindPageTools() {
      const coverChange = document.querySelector('.change-cover-photo');
      if (coverChange) coverChange.addEventListener('click', () => els.coverPhotoInput.click());

      const coverRemove = document.querySelector('.remove-cover-photo');
      if (coverRemove) coverRemove.addEventListener('click', () => {
        state.coverImage = '';
        render();
      });

      document.querySelectorAll('.observation-page').forEach(pageEl => {
        const id = pageEl.dataset.id;

        pageEl.querySelector('.change-photo').addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.addEventListener('change', async () => {
            const file = input.files && input.files[0];
            if (!file) return;
            const imageData = await fileToDataURL(file);
            const page = state.observationPages.find(p => p.id === id);
            if (page) page.imageData = imageData;
            render();
          });
          input.click();
        });

        pageEl.querySelector('.duplicate-page').addEventListener('click', () => {
          const page = state.observationPages.find(p => p.id === id);
          if (!page) return;
          const index = state.observationPages.findIndex(p => p.id === id);
          state.observationPages.splice(index + 1, 0, { ...page, id: makeId() });
          render();
        });

        pageEl.querySelector('.delete-page').addEventListener('click', () => {
          state.observationPages = state.observationPages.filter(p => p.id !== id);
          render();
        });
      });
    }

    function addBlankPage(shouldRender = true) {
      state.observationPages.push({ id: makeId(), imageData: '' });
      if (shouldRender) render();
    }

    async function addObservationFiles(files) {
      const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
      for (const file of imageFiles) {
        const imageData = await fileToDataURL(file);
        state.observationPages.push({ id: makeId(), imageData });
      }
      render();
    }

    async function setCoverFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      state.coverImage = await fileToDataURL(file);
      render();
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function printSelected() {
      if (!els.showCover.checked && !els.showResearch.checked && !els.showObservation.checked) {
        alert('印刷するフォーマットを1つ以上チェックしてください。');
        return;
      }
      window.print();
    }

    function saveDraft() {
      const data = {
        showCover: els.showCover.checked,
        showResearch: els.showResearch.checked,
        showObservation: els.showObservation.checked,
        photoOrientation: els.photoOrientation.value,
        coverImage: state.coverImage,
        observationPages: state.observationPages
      };
      localStorage.setItem('summerObservationA4HandwritingToolV2', JSON.stringify(data));
      alert('下書きを保存しました。');
    }

    function loadDraft() {
      const raw = localStorage.getItem('summerObservationA4HandwritingToolV2');
      if (!raw) {
        alert('保存された下書きがありません。');
        return;
      }
      const data = JSON.parse(raw);
      els.showCover.checked = data.showCover ?? true;
      els.showResearch.checked = data.showResearch ?? true;
      els.showObservation.checked = data.showObservation ?? true;
      els.photoOrientation.value = data.photoOrientation || 'landscape';
      state.coverImage = data.coverImage || '';
      state.observationPages = Array.isArray(data.observationPages) ? data.observationPages : [];
      render();
    }

    function clearAll() {
      if (!confirm('すべての写真とページを消しますか？')) return;
      state.coverImage = '';
      state.observationPages = [];
      render();
    }

    [els.showCover, els.showResearch, els.showObservation, els.photoOrientation].forEach(el => {
      el.addEventListener('change', render);
    });

    els.coverPhotoInput.addEventListener('change', event => {
      const file = event.target.files && event.target.files[0];
      setCoverFile(file);
      event.target.value = '';
    });

    els.photoInput.addEventListener('change', event => {
      addObservationFiles(event.target.files);
      event.target.value = '';
    });

    els.dropZone.addEventListener('dragover', event => {
      event.preventDefault();
      els.dropZone.classList.add('dragover');
    });

    els.dropZone.addEventListener('dragleave', () => els.dropZone.classList.remove('dragover'));

    els.dropZone.addEventListener('drop', event => {
      event.preventDefault();
      els.dropZone.classList.remove('dragover');
      addObservationFiles(event.dataTransfer.files);
    });

    els.printBtn.addEventListener('click', printSelected);
    els.addBlankBtn.addEventListener('click', () => addBlankPage(true));
    els.saveBtn.addEventListener('click', saveDraft);
    els.loadBtn.addEventListener('click', loadDraft);
    els.clearBtn.addEventListener('click', clearAll);

    addBlankPage(false);
    render();
  </script>
</body>
</html>
